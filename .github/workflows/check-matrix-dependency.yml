name: Check matrix proof dependency compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      admitted: ${{ steps.lease.outputs.admitted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/queue_lease.py acquire
  compile:
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/queue_lease.py check
      - name: Compile only the fixed-point dependency offline
        run: python3 scripts/check_matrix_dependency.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-compile-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
