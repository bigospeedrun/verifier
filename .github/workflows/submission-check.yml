name: Check one direct submission
on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      route:
        required: true
        type: string
      split:
        required: false
        type: boolean
        default: false
      chain:
        required: false
        type: boolean
        default: false
permissions: {}
jobs:
  build:
    # Split profile, job 1: one parallel build, then a trusted tar of the allowed files (docs/execution.md).
    if: inputs.split && inputs.route == 'issue'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      # prepare writes one solution target in a split run (verifier.chain_targets).
      BOS_SPLIT: ${{ inputs.split }}
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      build_sha256: ${{ steps.pack.outputs.build_sha256 }}
      build_record_sha256: ${{ steps.pack.outputs.build_record_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/submissions.py preflight
      # The tests run without the job's BOS_SPLIT: a test that prepares a one-job profile must not read it.
      - if: steps.gate.outputs.proceed == 'true'
        env:
          BOS_SPLIT: ''
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py prepare
      - if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py build
      # Also after a failed build step: pack keeps what exists. Never upload the raw folder.
      - id: pack
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python3 scripts/verifier.py pack
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 1
  verify:
    needs: build
    # build is skipped when not split. A status function lets this job run then; unpack refuses a failed build.
    # A chain profile runs the chain jobs below instead.
    if: ${{ !cancelled() && inputs.route == 'issue' && !inputs.chain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      # The gate and prepare read it (a split run follows job 1; verifier.chain_targets).
      BOS_SPLIT: ${{ inputs.split }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # A split run follows job 1's gate: a claimed-only end there uploads no build.
          BOS_BUILD_PROCEED: ${{ needs.build.outputs.proceed }}
        run: python3 scripts/submissions.py preflight
      # The tests run without the job's BOS_SPLIT (see the build job).
      - if: steps.gate.outputs.proceed == 'true'
        env:
          BOS_SPLIT: ''
        run: python3 -m unittest discover -s tests -v
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py prepare
      - if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - if: inputs.split && steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verifier-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: build-artifact
      - if: inputs.split && steps.gate.outputs.proceed == 'true'
        env:
          BOS_BUILD_RESULT: ${{ needs.build.result }}
          BOS_BUILD_SHA256: ${{ needs.build.outputs.build_sha256 }}
          BOS_BUILD_RECORD_SHA256: ${{ needs.build.outputs.build_record_sha256 }}
        run: python3 scripts/verifier.py unpack
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py verify_lean
      - if: always()
        env:
          BOS_RECEIPT_STAGE: lean
        run: python3 scripts/verifier.py finalize
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-receipt-and-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-lean
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        run: python3 scripts/verifier.py verify_nanoda
      - if: always()
        env:
          BOS_RECEIPT_STAGE: final
        run: python3 scripts/verifier.py finalize
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-receipt-and-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  pr_verify:
    if: inputs.route == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BOS_REQUEST_PATH: pr-request.json
      BOS_VERIFIER_COMMIT: ${{ github.sha }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/pr_submissions.py materialize_pr
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_submissions.py preflight_pr
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 -m unittest discover -s tests -v
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py prepare
      - if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        run: python3 scripts/verifier.py verify_lean
      - if: always()
        env:
          BOS_RECEIPT_STAGE: lean
        run: python3 scripts/verifier.py finalize
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-lean
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        run: python3 scripts/verifier.py verify_nanoda
      - if: always()
        env:
          BOS_RECEIPT_STAGE: final
        run: python3 scripts/verifier.py finalize
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  # Check chain (runner github-chain, docs/execution.md, scripts/chain.py): build1..build4, export, check1..check4
  # and final, a fixed graph. Each job starts only when the one before it says next (a trusted output); each
  # pinned hand-over is a sha256 that the producing job wrote as an output. The final job writes the one receipt
  # that the report job reads.
  chain_build1:
    if: inputs.chain && inputs.route == 'issue'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BOS_SPLIT: 'true'
      BOS_CHAIN_LEG: build1
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      build_sha256: ${{ steps.pack.outputs.build_sha256 }}
      build_record_sha256: ${{ steps.pack.outputs.build_record_sha256 }}
      done: ${{ steps.leg.outputs.done }}
      next: ${{ steps.leg.outputs.next }}
      chain_started: ${{ steps.leg.outputs.chain_started }}
      leg_sha256: ${{ steps.leg.outputs.leg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/submissions.py preflight
      # The tests run without the job's BOS_SPLIT (see the build job).
      - env:
          BOS_SPLIT: ''
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py prepare
      - timeout-minutes: 45
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py setup
      - if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py build
      # Also after a failed build step: pack keeps what exists. Never upload the raw folder.
      - id: pack
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python3 scripts/verifier.py pack
      - if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build1
          path: build-artifact/
          if-no-files-found: error
          retention-days: 2
      - id: leg
        if: always()
        run: python3 scripts/chain.py leg
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-leg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build1
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  chain_build2:
    needs: chain_build1
    if: ${{ !cancelled() && needs.chain_build1.outputs.next == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BOS_SPLIT: 'true'
      BOS_CHAIN_LEG: build2
      BOS_CHAIN_STARTED: ${{ needs.chain_build1.outputs.chain_started }}
    outputs:
      build_sha256: ${{ steps.pack.outputs.build_sha256 }}
      build_record_sha256: ${{ steps.pack.outputs.build_record_sha256 }}
      done: ${{ steps.leg.outputs.done }}
      next: ${{ steps.leg.outputs.next }}
      chain_started: ${{ steps.leg.outputs.chain_started }}
      leg_sha256: ${{ steps.leg.outputs.leg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      # The tests run without the job's BOS_SPLIT (see the build job).
      - env:
          BOS_SPLIT: ''
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        run: python3 scripts/verifier.py prepare
      - timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build1
          path: build-artifact
      - id: unpack
        env:
          BOS_BUILD_RESULT: ${{ needs.chain_build1.result }}
          BOS_BUILD_SHA256: ${{ needs.chain_build1.outputs.build_sha256 }}
          BOS_BUILD_RECORD_SHA256: ${{ needs.chain_build1.outputs.build_record_sha256 }}
        run: python3 scripts/verifier.py unpack
      - run: python3 scripts/verifier.py build
      # Also after a failed build step: pack keeps what exists. Never upload the raw folder.
      - id: pack
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: python3 scripts/verifier.py pack
      - if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build2
          path: build-artifact/
          if-no-files-found: error
          retention-days: 2
      - id: leg
        if: always()
        run: python3 scripts/chain.py leg
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-leg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build2
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  chain_build3:
    needs: chain_build2
    if: ${{ !cancelled() && needs.chain_build2.outputs.next == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BOS_SPLIT: 'true'
      BOS_CHAIN_LEG: build3
      BOS_CHAIN_STARTED: ${{ needs.chain_build2.outputs.chain_started }}
    outputs:
      build_sha256: ${{ steps.pack.outputs.build_sha256 }}
      build_record_sha256: ${{ steps.pack.outputs.build_record_sha256 }}
      done: ${{ steps.leg.outputs.done }}
      next: ${{ steps.leg.outputs.next }}
      chain_started: ${{ steps.leg.outputs.chain_started }}
      leg_sha256: ${{ steps.leg.outputs.leg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      # The tests run without the job's BOS_SPLIT (see the build job).
      - env:
          BOS_SPLIT: ''
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        run: python3 scripts/verifier.py prepare
      - timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build2
          path: build-artifact
      - id: unpack
        env:
          BOS_BUILD_RESULT: ${{ needs.chain_build2.result }}
          BOS_BUILD_SHA256: ${{ needs.chain_build2.outputs.build_sha256 }}
          BOS_BUILD_RECORD_SHA256: ${{ needs.chain_build2.outputs.build_record_sha256 }}
        run: python3 scripts/verifier.py unpack
      - run: python3 scripts/verifier.py build
      # Also after a failed build step: pack keeps what exists. Never upload the raw folder.
      - id: pack
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: python3 scripts/verifier.py pack
      - if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build3
          path: build-artifact/
          if-no-files-found: error
          retention-days: 2
      - id: leg
        if: always()
        run: python3 scripts/chain.py leg
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-leg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build3
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  chain_build4:
    needs: chain_build3
    if: ${{ !cancelled() && needs.chain_build3.outputs.next == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BOS_SPLIT: 'true'
      BOS_CHAIN_LEG: build4
      BOS_CHAIN_STARTED: ${{ needs.chain_build3.outputs.chain_started }}
    outputs:
      build_sha256: ${{ steps.pack.outputs.build_sha256 }}
      build_record_sha256: ${{ steps.pack.outputs.build_record_sha256 }}
      done: ${{ steps.leg.outputs.done }}
      next: ${{ steps.leg.outputs.next }}
      chain_started: ${{ steps.leg.outputs.chain_started }}
      leg_sha256: ${{ steps.leg.outputs.leg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      # The tests run without the job's BOS_SPLIT (see the build job).
      - env:
          BOS_SPLIT: ''
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        run: python3 scripts/verifier.py prepare
      - timeout-minutes: 45
        run: python3 scripts/verifier.py setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build3
          path: build-artifact
      - id: unpack
        env:
          BOS_BUILD_RESULT: ${{ needs.chain_build3.result }}
          BOS_BUILD_SHA256: ${{ needs.chain_build3.outputs.build_sha256 }}
          BOS_BUILD_RECORD_SHA256: ${{ needs.chain_build3.outputs.build_record_sha256 }}
        run: python3 scripts/verifier.py unpack
      - run: python3 scripts/verifier.py build
      # Also after a failed build step: pack keeps what exists. Never upload the raw folder.
      - id: pack
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: python3 scripts/verifier.py pack
      - if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build4
          path: build-artifact/
          if-no-files-found: error
          retention-days: 2
      - id: leg
        if: always()
        run: python3 scripts/chain.py leg
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-leg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-build4
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  chain_export:
    needs: [chain_build1, chain_build2, chain_build3, chain_build4]
    if: ${{ !cancelled() && inputs.chain && inputs.route == 'issue' && (needs.chain_build1.outputs.done == 'true' || needs.chain_build2.outputs.done == 'true' || needs.chain_build3.outputs.done == 'true' || needs.chain_build4.outputs.done == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    env:
      BOS_REQUEST_PATH: request/request.json
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BOS_SPLIT: 'true'
      BOS_CHAIN_LEG: export
      BOS_CHAIN_STARTED: ${{ needs.chain_build1.outputs.chain_started }}
    outputs:
      check_from: ${{ steps.leg.outputs.check_from }}
      hash_from: ${{ steps.leg.outputs.hash_from }}
      export_sha256: ${{ steps.leg.outputs.export_sha256 }}
      challenge_sha256: ${{ steps.leg.outputs.challenge_sha256 }}
      next: ${{ steps.leg.outputs.next }}
      chain_started: ${{ steps.leg.outputs.chain_started }}
      leg_sha256: ${{ steps.leg.outputs.leg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - run: python3 scripts/submissions.py materialize
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BOS_BUILD_PROCEED: ${{ needs.chain_build1.outputs.proceed }}
        run: python3 scripts/submissions.py preflight
      # The tests run without the job's BOS_SPLIT (see the build job).
      - env:
          BOS_SPLIT: ''
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -m unittest discover -s tests -v
      - id: prepare
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py prepare
      - timeout-minutes: 45
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/verifier.py setup
      # The challenge export, in its own unit before unpack: no submission build file is on the machine yet.
      - id: challenge
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/chain.py challenge
      - id: pick
        if: steps.gate.outputs.proceed == 'true'
        env:
          BOS_CHAIN_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/chain.py pick
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: chain-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.issue_number }}-${{ steps.pick.outputs.leg }}
          path: build-artifact
      - env:
