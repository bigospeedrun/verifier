name: Verify direct submissions
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      smoke_route:
        description: Maintainer-only fixed DFT smoke, never imported
        type: choice
        options: [none, issue, pull_request]
        default: none
      smoke_number:
        description: Test issue or PR number (fixed DFT fixture only)
        type: string
        default: ''
permissions: {}
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: select
        continue-on-error: true
        name: Select up to ten record challenges from distinct accounts
        env:
          GH_TOKEN: ${{ github.token }}
          BOS_SMOKE_DISPATCH: '1'
        run: python3 scripts/submissions.py select
      - if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests/
          retention-days: 90
  check:
    needs: select
    if: needs.select.outputs.selected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/submission-check.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      route: ${{ matrix.route }}
