name: Verify direct submissions
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      smoke_route:
        description: Maintainer-only fixed smoke, never imported (the Catalan smoke posts nothing)
        type: choice
        options: [none, issue, pull_request]
        default: none
      smoke_number:
        description: Test issue or PR number (fixed fixtures only; Catalan needs a maintainer issue with label test)
        type: string
        default: ''
permissions: {}
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      # write: the acknowledgement pass replies on PRs too (an issue comment on a PR needs it).
      pull-requests: write
      actions: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: select
        continue-on-error: true
        name: Select up to ten record challenges from distinct accounts
        env:
          GH_TOKEN: ${{ github.token }}
          BOS_SMOKE_DISPATCH: '1'
        run: python3 scripts/submissions.py select
      - if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests/
          retention-days: 90
  check:
    needs: select
    if: needs.select.outputs.selected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/submission-check.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      route: ${{ matrix.route }}
      split: ${{ matrix.split == true }}
      chain: ${{ matrix.chain == true }}
  # The verdict of each issue, after every check leg ended (verifier#190 follow-up, 2026-11-10): run 42648121034 checked
  # #187 and #190 in one matrix, and GitHub never created the report job of #190 inside the reusable workflow (no error;
  # the run ended failure). A plain matrix job here, outside the reusable workflow, depends on the whole check matrix.
  # It reads only the request and the receipt artifact of its issue, on a fresh VM with issue write permission.
  report:
    needs: [select, check]
    if: ${{ always() && needs.select.outputs.selected == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      ISSUE_NUMBER: ${{ matrix.issue_number }}
    steps:
      - if: matrix.route == 'issue'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: matrix.route == 'issue'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: direct-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: requests
      - if: matrix.route == 'issue'
        run: python3 scripts/submissions.py materialize
      - if: matrix.route == 'issue'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verifier-receipt-and-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.issue_number }}
          path: result
      - if: matrix.route == 'issue'
        name: Validate receipt and prepare result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/submissions.py report
      - if: matrix.route == 'issue'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-submission-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.issue_number }}
          path: published/direct-submission.json
          if-no-files-found: error
          retention-days: 90
      - if: matrix.route == 'issue'
        name: Post result after storing the result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/submissions.py publish
