name: Lean proof submission
description: Submit a pinned proof for a bound that matches or beats the current record
title: '[Lean submission] '
body:
  - type: markdown
    attributes:
      value: Current records and boards for each problem are on [bigospeedrun.com](https://bigospeedrun.com).
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options: [dft, 3sum, apsp, average-sensitivity, catalan, subset-sum, snaky, heilbronn-triangle, directed-sssp, prime-gaps, 3sat]
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/OWNER/REPO
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      placeholder: Full 40-character lowercase commit SHA
    validations:
      required: true
  - type: input
    id: bound
    attributes:
      label: Bound
      placeholder: Reduced exact rational, such as 1999/1000 (directed-sssp: D ; T, such as n log^3/4 ; n log^11/12)
    validations:
      required: true
